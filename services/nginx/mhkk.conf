# Docker embedded DNS — resolve upstreams at request time (avoids startup race).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    charset utf-8;

    client_max_body_size 75M;

    root /var/www/html;
    index index.html;

    set $django_upstream web:8000;

    # your Django project's media files
    location /media {
        alias /app/media;
    }
    location /static {
        alias /app/static;
    }

    # Proxy to Django admin
    location /admin {
        proxy_pass http://$django_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    # Proxy to Django API
    location /api {
        proxy_pass http://$django_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    # Proxy to CKEditor upload
    location /ckeditor/upload/ {
        proxy_pass http://$django_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    # Serve frontend files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
